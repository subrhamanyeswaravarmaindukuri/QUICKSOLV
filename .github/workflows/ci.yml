name: QuickSolv 1.0 Production CI/CD Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Verify ESLint Rules
        run: npm run lint

      - name: Build Next.js Production Bundle
        run: npm run build
